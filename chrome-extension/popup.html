<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    /* ── Reset ───────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Design Tokens (perfectly matching dashboard) ────── */
    :root {
      --accent-50:  #eef4ff;
      --accent-100: #e0ecff;
      --accent-200: #c7dcfe;
      --accent-400: #60a5fa;
      --accent-500: #3b82f6;
      --accent-600: #1d61ea;
      --accent-700: #1753ce;
      --accent-800: #1244ab;
      --accent-900: #0d3485;

      --ice-50:  #f4f7fc;
      --ice-100: #eef3fc;
      --ice-200: #e2eaf8;

      --zinc-25:  #fcfcfd;
      --zinc-50:  #fafafa;
      --zinc-100: #f4f4f5;
      --zinc-150: #ececee;
      --zinc-200: #e2e8f0;
      --zinc-300: #cbd5e1;
      --zinc-400: #94a3b8;
      --zinc-500: #64748b;
      --zinc-600: #475569;
      --zinc-700: #334155;
      --zinc-800: #1e293b;
      --zinc-900: #0f172a;

      --green:     #16a34a;
      --green-bg:  #f0fdf4;
      --green-mid: #86efac;
      --amber:     #d97706;
      --amber-bg:  #fffbeb;
      --red:       #ef4444;
      --red-bg:    #fef2f2;

      --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', monospace;

      --radius-xs:   4px;
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   16px;
      --radius-xl:   20px;
      --radius-full: 999px;

      --shadow-xs: 0 1px 2px rgba(15,23,42,.04);
      --shadow-sm: 0 2px 6px rgba(15,23,42,.05);
      --shadow-md: 0 4px 16px rgba(15,23,42,.08);

      --ease-out: cubic-bezier(.16,1,.3,1);
      --ease-spring: cubic-bezier(.34,1.56,.64,1);
    }

    body {
      width: 340px;
      font-family: var(--font);
      font-size: 13px;
      color: var(--zinc-800);
      background: linear-gradient(135deg, #1d61ea 0%, #2067f5 45%, #1754d2 100%);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Popup Shell ─────────────────────────────────────── */
    .popup {
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: var(--radius-xl);
      margin: 7px;
      overflow: hidden;
      box-shadow:
        0 12px 32px -8px rgba(16,45,115,.28),
        0 4px 12px -2px rgba(0,0,0,.06),
        0 0 0 1px rgba(255,255,255,.06) inset;
      animation: popupIn .38s var(--ease-out) both;
    }

    @keyframes popupIn {
      from { opacity: 0; transform: translateY(8px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Header ──────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 15px 17px 13px;
      background: linear-gradient(135deg, #1d61ea 0%, #1e6bf5 60%, #1753ce 100%);
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow blobs matching the dashboard backdrop */
    .header::before {
      content: '';
      position: absolute;
      top: -28px; right: -20px;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      pointer-events: none;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -24px; left: -16px;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(10,45,130,.25);
      pointer-events: none;
    }

    /* Brand icon (owl-eye circle motif) */
    .header__brand {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .header__brand svg { width: 18px; height: 18px; color: white; }

    .header__text { position: relative; z-index: 1; flex: 1; min-width: 0; }

    .header__title {
      font-size: 14px;
      font-weight: 800;
      color: white;
      letter-spacing: -0.015em;
      line-height: 1.2;
    }

    .header__subtitle {
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(255,255,255,.65);
      margin-top: 1px;
      letter-spacing: 0.02em;
    }

    /* Status badge */
    .header__badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 8px;
      border-radius: var(--radius-full);
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      color: white;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      letter-spacing: 0.01em;
      transition: background .2s;
    }

    .header__badge--connected {
      background: rgba(22,163,74,.28);
      border-color: rgba(134,239,172,.3);
    }
    .header__badge--warning {
      background: rgba(217,119,6,.28);
      border-color: rgba(252,211,77,.3);
    }
    .header__badge--error {
      background: rgba(239,68,68,.28);
      border-color: rgba(252,165,165,.3);
    }

    .header__badge .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.7);
    }
    .header__badge--connected .pulse-dot {
      background: var(--green-mid);
      animation: pulseDot 2s ease-in-out infinite;
    }
    .header__badge--warning .pulse-dot  { background: #fcd34d; }
    .header__badge--error   .pulse-dot  { background: #fca5a5; }

    @keyframes pulseDot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .5; transform: scale(.75); }
    }

    /* ── Body ────────────────────────────────────────────── */
    .body {
      padding: 14px 15px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Info Row (Meet + Name side by side) ─────────────── */
    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .info-card {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--ice-50);
      border: 1px solid var(--ice-200);
      transition: transform .15s var(--ease-out), box-shadow .15s var(--ease-out);
      animation: cardIn .35s var(--ease-out) both;
    }

    .info-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(29,97,234,.07);
    }

    .info-card:nth-child(1) { animation-delay: .06s; }
    .info-card:nth-child(2) { animation-delay: .1s;  }

    .info-card__label {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--zinc-400);
      margin-bottom: 5px;
    }

    .info-card__value {
      font-size: 13px;
      font-weight: 700;
      color: var(--zinc-900);
      display: flex;
      align-items: center;
      gap: 5px;
      line-height: 1.2;
    }

    .info-card__value--sm {
      font-size: 11.5px;
      font-weight: 600;
    }

    .info-card__value--muted   { color: var(--zinc-400); }
    .info-card__value--green   { color: var(--green); }
    .info-card__value--amber   { color: var(--amber); }

    /* Status dot */
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot--green { background: var(--green); box-shadow: 0 0 0 2px var(--green-bg); }
    .dot--amber { background: var(--amber); box-shadow: 0 0 0 2px var(--amber-bg); }
    .dot--gray  { background: var(--zinc-300); }
    .dot--red   { background: var(--red);   box-shadow: 0 0 0 2px var(--red-bg); }

    /* ── Prompt Section ──────────────────────────────────── */
    .prompt-section {
      animation: cardIn .35s var(--ease-out) .14s both;
    }

    .prompt-card {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--accent-50);
      border: 1px solid var(--accent-100);
      position: relative;
      overflow: hidden;
    }

    /* Subtle blue shimmer bar at top */
    .prompt-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-600), var(--accent-400));
      border-radius: var(--radius-full);
    }

    .prompt-card__label {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--accent-600);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .prompt-card__label svg { width: 11px; height: 11px; }

    .prompt-card__phrase {
      font-size: 13px;
      font-weight: 600;
      color: var(--zinc-900);
      line-height: 1.45;
    }

    /* Empty / no-prompt state */
    .prompt-card--empty {
      background: var(--ice-50);
      border-color: var(--ice-200);
    }
    .prompt-card--empty::before { display: none; }
    .prompt-card--empty .prompt-card__label { color: var(--zinc-400); }
    .prompt-card--empty .prompt-card__phrase {
      color: var(--zinc-400);
      font-weight: 500;
      font-style: italic;
    }

    /* ── Sound Toggle ─────────────────────────────────────── */
    .sound-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--ice-200);
      background: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--zinc-700);
      transition: background .15s;
      animation: cardIn .35s var(--ease-out) .18s both;
    }

    .sound-row:hover { background: var(--ice-50); }

    .sound-row .sound-label {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .sound-row .sound-label svg {
      width: 13px;
      height: 13px;
      color: var(--zinc-400);
    }

    /* Custom toggle switch */
    .toggle {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle__track {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-full);
      background: var(--zinc-200);
      transition: background .2s var(--ease-out);
      cursor: pointer;
    }

    .toggle__thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: transform .2s var(--ease-spring);
      pointer-events: none;
    }

    .toggle input:checked ~ .toggle__track { background: var(--accent-600); }
    .toggle input:checked ~ .toggle__thumb { transform: translateX(14px); }

    /* ── Footer ──────────────────────────────────────────── */
    .footer {
      padding: 9px 15px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-top: 1px solid var(--ice-200);
      background: var(--zinc-25);
    }

    .footer svg { width: 11px; height: 11px; color: var(--zinc-300); }

    .footer__text {
      font-size: 9.5px;
      font-weight: 500;
      color: var(--zinc-400);
      letter-spacing: 0.01em;
    }

    /* ── Shared entrance animation ─────────────────────────── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Reduced motion ────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .popup, .info-card, .prompt-section, .sound-row { animation: none; }
      .toggle__thumb { transition: none; }
    }
  </style>
</head>
<body>
  <div class="popup">

    <!-- ══ Header ══ -->
    <div class="header">
      <!-- Brand icon -->
      <div class="header__brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" fill="rgba(255,255,255,0.15)"/>
          <circle cx="12" cy="12" r="9" opacity="0.5"/>
          <circle cx="14" cy="10" r="1.5" fill="white" stroke="none"/>
        </svg>
      </div>
      <!-- Title -->
      <div class="header__text">
        <div class="header__title">Kuwago</div>
        <div class="header__subtitle">Classroom monitor</div>
      </div>
      <!-- Connection badge -->
      <div class="header__badge" id="badge-connection">
        <span class="pulse-dot"></span>
        <span id="badge-label">Checking</span>
      </div>
    </div>

    <!-- ══ Body ══ -->
    <div class="body">

      <!-- Meet tab + Student name row -->
      <div class="info-row">
        <div class="info-card">
          <div class="info-card__label">Meet Tab</div>
          <div class="info-card__value" id="status-meet">
            <span class="dot dot--gray"></span>
            <span>None</span>
          </div>
        </div>
        <div class="info-card">
          <div class="info-card__label">Detected As</div>
          <div class="info-card__value info-card__value--sm" id="status-name">—</div>
        </div>
      </div>

      <!-- Active Prompt -->
      <div class="prompt-section">
        <div id="card-prompt">
          <!-- Filled dynamically by popup.js -->
        </div>
      </div>

      <!-- Sound toggle -->
      <label class="sound-row" for="toggle-sound">
        <span class="sound-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          Prompt sounds
        </span>
        <label class="toggle">
          <input type="checkbox" id="toggle-sound" checked />
          <span class="toggle__track"></span>
          <span class="toggle__thumb"></span>
        </label>
      </label>

    </div>

    <!-- ══ Footer ══ -->
    <div class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span class="footer__text">Data sent securely to your professor's dashboard</span>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
